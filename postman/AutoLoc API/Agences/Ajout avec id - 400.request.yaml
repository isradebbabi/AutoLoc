$kind: http-request
url: "{{asiApiUrl}}/agences"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "id": 999999,
      "nom": "Agence avec id interdit",
      "ville": "Tunis",
      "adresse": "Test",
      "telephone": "+216 71 000 099"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Ajout avec id => 400', function () { pm.response.to.have.status(400); });
order: 1500
