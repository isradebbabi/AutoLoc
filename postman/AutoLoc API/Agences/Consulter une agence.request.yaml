$kind: http-request
url: "{{asiApiUrl}}/agences/{{agenceId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Consultation agence existante => 200', function () { pm.response.to.have.status(200); });
      pm.test('Réponse JSON', function () { pm.response.to.be.json; });
order: 3000
