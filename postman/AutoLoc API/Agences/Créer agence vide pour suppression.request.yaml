$kind: http-request
url: "{{asiApiUrl}}/agences"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "nom": "Agence temporaire suppression",
      "ville": "Sousse",
      "adresse": "Adresse temporaire",
      "telephone": "+216 73 000 000"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Création agence temporaire => 201', function () { pm.response.to.have.status(201); });
      var json = pm.response.json();
      if (json.id) pm.collectionVariables.set('deleteAgenceId', json.id);
order: 5000
